# Server connection settings used by the Nano extension and local API.
host = "127.0.0.1"
port = 8765

# Queue and download concurrency.
max_concurrent_downloads = 1

# UI / browser behavior.
close_tab_on_success = false # Not yet used by the current worker.

# Subtitle and metadata post-processing.
write_subtitles = true
embed_subtitles = true
subtitle_languages = ["en", "de"] # Not yet used by the current worker.

embed_thumbnail = true

embed_metadata = true
embed_chapters = true

# Video format and ffmpeg post-processing.
preferred_video_container = ["mp4", "webm", "mkv"]
preferred_audio_container = "opus"                 # Not yet used by the current worker.

p_vcodec = "avc1"
p_acodec = "mp4a"

remux_video = false
remux_audio = false # Not yet used by the current worker.

recode_video = true
compress = true

merge_final = true

# max resolution: height (1080), yt format (1920p) or resolution (1920x1080)
max_resolution = "1920x1080"

# Authentication / cookies.
cookies_from_browser = true
browser_name = "firefox"
cookies_file = ""           # Optional exported cookies file path. Leave empty to disable.

# SponsorBlock post-processing.
sponsorblock_enabled = true
sponsorblock_categories = [
  "sponsor",
  "selfpromo",
  "interaction",
  "intro",
  "outro",
]
# Force keyframes at cuts when downloading/splitting/removing sections. This is slow due to needing a re-encode, but the resulting video may have fewer artifacts around the cuts
sb_force_keyframe_at_cut = true

# mark video as watched on YouTube
mark_watched = false # NOT YET IMPLEMENTED

# Download output and local bookkeeping.
output_template = "E:/downloads/%(title)s.%(ext)s"

archive_file = "archive.txt"   # Not yet used by the current worker.
database_file = "downloads.db"

js_runtime_loc = ".env/JSRUNTIME"
ffprobe_loc = ".env/FFPROBE"
ffmpeg_loc = ".env/FFMPEG"

# run yt-dlp in verbal mode (useful for debugging etc.)
ytdlp_verbal = false
progress = true
