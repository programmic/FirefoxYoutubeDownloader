# Server connection.
host = "127.0.0.1"
port = 8765
show_config_on_startup = true

# Queue and download behavior.
download_timeout = 0 # Seconds per video; 0 = no limit (H1).
max_concurrent_downloads = 1
mark_watched = false # Not yet implemented.
progress = true
ytdlp_verbal = false # Enable verbose yt-dlp output for debugging.

# Authentication and cookies.
browser_name = "firefox"
cookies_file = "" # Optional exported cookies file path. Leave empty to disable.
cookies_from_browser = true

# Video and audio format selection.
max_resolution = "1920x1080" # Height (1080), yt format (1920p), or resolution (1920x1080).
p_acodec = "mp4a"
p_vcodec = "hvec"
preferred_audio_container = "opus" # Not yet used by the current worker.
preferred_video_container = ["mp4", "webm", "mkv"]

# Final encode: one ffmpeg pass performs the SponsorBlock cut, loudnorm,
# and compression.
audio_bitrate = "96k" # Opus.
avoid_size_increase = true # Never publish a result larger than the download: short CRF search, then one full encode. Off: one encode at video_crf, any size.
on_size_fail = "keep_source" # If even max_crf is not smaller than the download: "keep_source" | "fail" | "encode_anyway".
crf_search_only = false # true = only run the CRF search, print the table, keep the download. For calibration.
crf_search_samples = 6 # Sample clips per CRF trial, spread over the video. 0 = no search (the first full encode is the measurement).
crf_search_seconds = 10 # Length of each sample clip. Longer = more accurate but slower.
max_encode_attempts = 3 # Full encodes per video (the CRF search normally makes 1 enough).
stats_interval = 300 # Seconds between permanent status lines during a full encode; 0 = off.
# Calibration run (about 10-15 min per video, nothing is encoded in full): temporarily set
#   max_crf = 50, crf_search_only = true
# queue one video and read the "Attempts" table to see which CRF gives which size, then pick your real max_crf.
compress = true
ffmpeg_threads = 0 # 0 lets FFmpeg use the available CPU; set a positive value to cap it.
merge_final = true
normalize_audio = -16 # LUFS (-30..-5). Remove the key to disable.
recode_video = false # yt-dlp must not re-encode; the final pass does that.
remux_video = false
video_codec = "hevc" # "av1" | "hevc" | "h264".
video_pixel_format = "yuv420p" # "yuv420p10le" = 10-bit | "yuv420p" = 8-bit.
video_crf = 25 # AV1 ~30-34, HEVC ~24-28, H.264 ~21-24; lower = bigger/better. Your preferred quality: kept whenever the result is smaller than the download.
max_crf = 32 # WORST quality you accept. CRF is raised above video_crf only as far as needed to end up smaller than the download, never above this. (Was spelled max_CRF; TOML keys are case-sensitive.)
video_preset = 4
max_video_fps = 29.97 # 0 = no limit. If the source is higher, it will be downsampled to this.

# Download output and bookkeeping.
# Max 150 bytes of title so Windows paths stay valid (H11).
output_template = "E:/downloads/%(title).150B.%(ext)s"
archive_file = "archive.txt" # Not yet used by the current worker.
database_file = "downloads.db"

# Subtitle and metadata post-processing.
embed_chapters = true
embed_metadata = true
embed_subtitles = true
embed_thumbnail = true
subtitle_languages = ["en", "de"]
write_subtitles = true

# SponsorBlock post-processing.
sb_force_keyframe_at_cut = true # Slow: cuts require a re-encode.
sponsorblock_categories = [
  "sponsor",
  "selfpromo",
  "interaction",
  "intro",
  "outro",
]
sponsorblock_enabled = true

# UI and browser behavior.
close_tab_on_success = false # Not yet used by the current worker.
print_command = false

# Optional extra allowed Origins, e.g. if the extension sends from a content script.
# allowed_origins = ["https://www.youtube.com"]

# External tools.
ffmpeg_loc = ".env/FFMPEG"
ffprobe_loc = ".env/FFPROBE"
js_runtime_loc = ".env/JSRUNTIME"

# Audio remuxing.
remux_audio = false # Not yet used by the current worker.