# Server connection.
host = "127.0.0.1"
port = 8765
show_config_on_startup = true

# Queue and download behavior.
download_timeout = 0 # Seconds per video; 0 = no limit (H1).
max_concurrent_downloads = 1
mark_watched = false # Not yet implemented.
progress = true
ytdlp_verbal = false # Enable verbose yt-dlp output for debugging.

# Authentication and cookies.
browser_name = "firefox"
cookies_file = "" # Optional exported cookies file path. Leave empty to disable.
cookies_from_browser = true

# Video and audio format selection.
max_resolution = "1920x1080" # Height (1080), yt format (1920p), or resolution (1920x1080).
p_acodec = "mp4a"
p_vcodec = "avc1"
preferred_audio_container = "opus" # Not yet used by the current worker.
preferred_video_container = ["mp4", "webm", "mkv"]

# Final encode: one ffmpeg pass performs the SponsorBlock cut, loudnorm,
# and compression.
audio_bitrate = "96k" # Opus.
avoid_size_increase = true # Retry once at a higher CRF when encoding expands the source.
compress = true
ffmpeg_threads = 1 # Bound decoder/filter memory for long AV1 sources.
merge_final = true
normalize_audio = -16 # LUFS (-30..-5). Remove the key to disable.
recode_video = false # yt-dlp must not re-encode; the final pass does that.
remux_video = false
video_codec = "av1" # "av1" | "hevc" | "h264".
video_crf = 30 # AV1 ~30-34, HEVC ~24-28, H.264 ~21-24; lower = bigger/better.
video_preset = 4 # SVT-AV1: 0-13; x265/x264: "slow", "slower", ...

# Download output and bookkeeping.
# Max 150 bytes of title so Windows paths stay valid (H11).
output_template = "E:/downloads/%(title).150B.%(ext)s"
archive_file = "archive.txt" # Not yet used by the current worker.
database_file = "downloads.db"

# Subtitle and metadata post-processing.
embed_chapters = true
embed_metadata = true
embed_subtitles = true
embed_thumbnail = true
subtitle_languages = ["en", "de"]
write_subtitles = true

# SponsorBlock post-processing.
sb_force_keyframe_at_cut = true # Slow: cuts require a re-encode.
sponsorblock_categories = [
  "sponsor",
  "selfpromo",
  "interaction",
  "intro",
  "outro",
]
sponsorblock_enabled = true

# UI and browser behavior.
close_tab_on_success = false # Not yet used by the current worker.
print_command = false

# Optional extra allowed Origins, e.g. if the extension sends from a content script.
# allowed_origins = ["https://www.youtube.com"]

# External tools.
ffmpeg_loc = ".env/FFMPEG"
ffprobe_loc = ".env/FFPROBE"
js_runtime_loc = ".env/JSRUNTIME"

# Audio remuxing.
remux_audio = false # Not yet used by the current worker.
